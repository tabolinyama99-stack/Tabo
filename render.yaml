# Render.com Blueprint: managed PostgreSQL + Docker web service (HTTPS, health check, persistent disk).
# Deploy: Render Dashboard → New → Blueprint → choose this repository. You will be asked for the
# values marked `sync: false` (Super Admin login, company name, optional Anthropic API key).
databases:
  - name: tael-books-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: tael_books
    user: tael
    ipAllowList: []          # only reachable from services inside Render
services:
  - type: web
    name: tael-books
    runtime: docker
    plan: starter            # a paid plan is required for the persistent disk (uploads, logos, backups)
    region: frankfurt
    healthCheckPath: /healthz
    disk: { name: tael-data, mountPath: /data, sizeGB: 5 }
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: tael-books-db, property: connectionString }
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: JOBS_ENABLED
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
