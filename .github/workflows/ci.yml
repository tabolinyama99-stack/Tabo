name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: tael, POSTGRES_PASSWORD: tael, POSTGRES_DB: tael_books_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils postgresql-client
      - run: npm --prefix server ci && npm --prefix client ci
      - run: npm --prefix client run build
      - run: npm --prefix server test
        env: { TEST_DATABASE_URL: postgres://tael:tael@localhost:5432/tael_books_test }
